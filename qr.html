<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan to Register — AI Hackathon</title>
<link rel="icon" href="assets/cloudnate-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --void:#020716; --plasma:#27e1ff; --ea:#fd9623; --eb:#e32a23; --ink:#eaf6ff; --ink2:#a9c3e8; --line:rgba(64,214,255,.25); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--void); color: var(--ink); font-family: "Chakra Petch", sans-serif; overflow: hidden; display: grid; place-items: center; }
  .bg { position: fixed; inset: 0; z-index: -1;
    background: radial-gradient(900px 700px at 80% 0%, rgba(30,91,255,.4), transparent 60%),
                radial-gradient(800px 600px at 10% 100%, rgba(227,42,35,.22), transparent 60%),
                url("assets/skyline.jpg") right bottom / auto 70% no-repeat, var(--void); }
  .bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--void) 35%, rgba(2,7,22,.55)),
    repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px); }
  .grid { position: fixed; inset: 0; z-index: -1; opacity: .6; background-image: linear-gradient(rgba(39,225,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(39,225,255,.06) 1px, transparent 1px);
    background-size: 5vmin 5vmin; mask-image: radial-gradient(circle at 70% 50%, #000, transparent 70%); }
  .poster { width: min(1500px, 94vw); display: grid; grid-template-columns: 1.1fr 1fr; gap: 6vmin; align-items: center; }
  .mono { font-family: "JetBrains Mono", monospace; letter-spacing: .14em; text-transform: uppercase; }
  .top { display: flex; align-items: center; gap: 1.6vmin; color: var(--ea); font-size: clamp(11px, 1.5vmin, 18px); margin-bottom: 3vmin; }
  .top i { width: 1.2vmin; height: 1.2vmin; min-width: 8px; min-height: 8px; border-radius: 50%; background: var(--ea); box-shadow: 0 0 16px var(--ea); animation: p 1.2s steps(1) infinite; }
  @keyframes p { 50% { opacity: .2 } }
  .brand { display: flex; align-items: center; gap: 2.4vmin; margin-bottom: 3vmin; }
  .brand img { width: 11vmin; filter: drop-shadow(0 0 3vmin rgba(253,150,35,.6)); }
  .brand span { font-family: "Unbounded"; font-weight: 800; font-size: 4.2vmin; line-height: 1; }
  .brand small { display: block; font-family: "JetBrains Mono"; font-weight: 400; font-size: 1.5vmin; letter-spacing: .16em; text-transform: uppercase; color: var(--ink2); margin-bottom: .8vmin; }
  h1 { font-family: "Unbounded"; font-weight: 800; text-transform: uppercase; font-size: clamp(34px, 9vmin, 150px); line-height: .9; margin: 0 0 3vmin; letter-spacing: -.03em; }
  h1 em { font-style: normal; background: linear-gradient(100deg, var(--ea), var(--eb)); -webkit-background-clip: text; background-clip: text; color: transparent; display: block; }
  .sub { font-size: clamp(15px, 2.6vmin, 34px); color: var(--ink2); margin: 0 0 4vmin; max-width: 30ch; }
  .meta { display: grid; gap: 1.2vmin; font-size: clamp(13px, 2.1vmin, 26px); border-left: 2px solid var(--plasma); padding-left: 2.4vmin; }
  .meta b { color: var(--plasma); font-family: "Unbounded"; font-weight: 600; }
  .ff { margin-top: 4vmin; color: var(--ink2); font-size: clamp(10px, 1.5vmin, 18px); }
  .ff-logos { display: flex; align-items: center; gap: 2.6vmin; margin-top: 4.5vmin; flex-wrap: wrap; }
  .ff-logos img { height: 6vmin; min-height: 34px; width: auto; }
  .ff-logos .ff-main { height: 8vmin; min-height: 44px; }
  .ff-logos .stamp { height: 10vmin; min-height: 54px; opacity: .6; }
  img.patron { display: block; height: 5vmin; min-height: 28px; width: auto; margin-top: 3vmin; opacity: .85; }
  .qr-wrap { position: relative; justify-self: center; width: min(62vmin, 44vw); }
  .qr-frame { position: relative; padding: 3vmin; background: rgba(4,13,38,.7); border: 1px solid var(--line);
    clip-path: polygon(0 0, calc(100% - 4vmin) 0, 100% 4vmin, 100% 100%, 4vmin 100%, 0 calc(100% - 4vmin)); }
  .qr-frame::before, .qr-frame::after { content: ""; position: absolute; width: 6vmin; height: 6vmin; border: 3px solid var(--plasma); }
  .qr-frame::before { top: 1.2vmin; left: 1.2vmin; border-right: 0; border-bottom: 0; }
  .qr-frame::after { bottom: 1.2vmin; right: 1.2vmin; border-left: 0; border-top: 0; }
  canvas#qr { width: 100%; height: auto; display: block; box-shadow: 0 0 8vmin rgba(39,225,255,.25); }
  .laser { position: absolute; left: 3vmin; right: 3vmin; height: 3px; top: 3vmin; background: linear-gradient(90deg, transparent, var(--ea), transparent);
    box-shadow: 0 0 20px var(--ea); animation: scan 3.2s ease-in-out infinite; pointer-events: none; }
  @keyframes scan { 50% { top: calc(100% - 3vmin) } }
  .cta { text-align: center; margin-top: 2.6vmin; font-family: "Unbounded"; font-weight: 600; text-transform: uppercase; font-size: clamp(14px, 2.8vmin, 38px); letter-spacing: .06em; }
  .cta small { display: block; font-family: "JetBrains Mono"; font-weight: 400; font-size: clamp(9px, 1.3vmin, 16px); color: var(--ink2); letter-spacing: .1em; margin-top: 1vmin; word-break: break-all; text-transform: none; }

  .ctrl { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; transition: opacity .3s; }
  body.clean .ctrl { opacity: 0; pointer-events: none; }
  .ctrl input { width: 340px; max-width: 60vw; background: rgba(2,7,22,.85); border: 1px solid var(--line); color: var(--ink); padding: 10px 12px; font-family: "JetBrains Mono"; font-size: 12px; }
  .ctrl button { background: rgba(39,225,255,.12); color: var(--plasma); border: 1px solid var(--line); padding: 10px 14px; font-family: "JetBrains Mono"; font-size: 12px; cursor: pointer; letter-spacing: .06em; }
  .ctrl button.hot { background: linear-gradient(100deg, var(--ea), var(--eb)); color: #fff; border: 0; }
  @media (max-aspect-ratio: 1/1) {
    body { overflow: auto; }
    .poster { grid-template-columns: 1fr; text-align: center; padding: 6vh 0 14vh; gap: 4vh; }
    .brand, .top, .ff-logos { justify-content: center; }
    img.patron { margin-inline: auto; }
    .meta { border-left: 0; padding: 0; }
    .sub { margin-inline: auto; }
    .qr-wrap { width: min(78vw, 60vh); }
    .qr-wrap { order: -1; }
  }
  @media print { .ctrl, .laser { display: none } body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
</style>
</head>
<body>
<div class="bg"></div><div class="grid"></div>

<main class="poster">
  <div>
    <div class="top mono"><i></i>Live at Future Food Forum 2026</div>
    <div class="brand"><img src="assets/cloudnate-mark.svg" alt="Cloudnate logo"><span><small>Powered by</small>Cloudnate</span></div>
    <h1>AI Hackathon<em>Scan to join</em></h1>
    <p class="sub">Build AI for a resilient food future. Register in under a minute.</p>
    <div class="meta">
      <div><b>29 – 30 September 2026</b></div>
      <div>Le Méridien Dubai Hotel &amp; Conference Centre</div>
    </div>
    <div class="ff-logos">
      <img class="ff-main" src="assets/logos/future-food-2026.png" alt="Future Food 2026">
      <img src="assets/logos/uae-food-cluster.png" alt="UAE Food Cluster">
      <img src="assets/logos/fb-business-group.png" alt="UAE Food &amp; Beverage Business Group">
      <img class="stamp" src="assets/logos/food-resilience-stamp.png" alt="Together towards food resilience">
    </div>
    <img class="patron" src="assets/logos/moet-patronage.png" alt="Under the patronage of the UAE Ministry of Economy &amp; Tourism">
  </div>
  <div class="qr-wrap">
    <div class="qr-frame"><canvas id="qr" width="1200" height="1200" aria-label="QR code: register for the AI Hackathon"></canvas><div class="laser"></div></div>
    <div class="cta">Point your camera here<small id="urlTxt"></small></div>
  </div>
</main>

<div class="ctrl" id="ctrl">
  <input id="urlIn" aria-label="Registration URL encoded in the QR code">
  <button id="apply">Update QR</button>
  <button id="dl" class="hot">Download PNG</button>
  <button id="fs">Fullscreen (F)</button>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js" integrity="sha384-lQXOAyZwHXE55JFyrOMB7nY2Wv+m5ZWNtJcHrd1rceRQXAYNLak8ukN5TjBTcIwz" crossorigin="anonymous"></script>
<script src="js/qr-render.js"></script>
<script>
  const cv = document.getElementById("qr");
  let url = registerURL();
  async function render() {
    document.getElementById("urlIn").value = url;
    document.getElementById("urlTxt").textContent = url.replace(/^https?:\/\//, "");
    await drawBrandQR(cv, url);
  }
  render();
  document.getElementById("apply").onclick = () => { url = document.getElementById("urlIn").value.trim() || registerURL(); render(); };
  document.getElementById("dl").onclick = async () => {
    // High-res printable tile with a white margin and caption.
    const out = document.createElement("canvas"); out.width = 2000; out.height = 2300;
    const q = document.createElement("canvas"); q.width = q.height = 1800;
    await drawBrandQR(q, url);
    const x = out.getContext("2d");
    x.fillStyle = "#fff"; x.fillRect(0, 0, out.width, out.height);
    x.drawImage(q, 100, 100);
    x.fillStyle = "#06133a"; x.textAlign = "center"; x.font = "700 78px Unbounded, sans-serif";
    x.fillText("AI HACKATHON", 1000, 2020);
    x.font = "44px 'Chakra Petch', sans-serif"; x.fillStyle = "#e32a23";
    x.fillText("Powered by Cloudnate · Scan to register · 29–30 Sep 2026", 1000, 2120);
    const a = document.createElement("a"); a.download = "cloudnate-hackathon-qr.png"; a.href = out.toDataURL("image/png"); a.click();
  };
  const fs = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
  document.getElementById("fs").onclick = fs;
  addEventListener("keydown", (e) => { if (e.target.tagName !== "INPUT" && e.key.toLowerCase() === "f") fs(); if (e.key.toLowerCase() === "h" && e.target.tagName !== "INPUT") document.body.classList.toggle("clean"); });
  document.addEventListener("fullscreenchange", () => document.body.classList.toggle("clean", !!document.fullscreenElement));
</script>
</body>
</html>
